<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>e-CSSD RSUD BENDA</title>
    <meta name="description" content="Sistem manajemen sterilisasi dan pelacakan alat medis RSUD Benda untuk mendukung operasional Central Sterile Services Department secara efisien dan terintegrasi." />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
    <meta name="theme-color" content="#2198a9" />
    
    <!-- iOS Safari -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="e-CSSD" />
    
    <!-- Android/Chrome -->
    <meta name="mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if (typeof navigator.serviceWorker !== 'undefined') {
        navigator.serviceWorker.register('sw.js').then(async (registration) => {
          if ('SyncManager' in window) {
            try {
              await registration.sync.register('database-sync');
            } catch {
              console.log("Background Sync failed.");
            }
          }
        });
      }
    </script>
  </body>
</html>
